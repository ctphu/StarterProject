# =============================================================================
# trivy-secret.yaml — secret-scanning configuration (Session 7)
#
# Put this file in the ROOT of the repository. CI passes it explicitly with
# --secret-config, for both the repository scan and the image scan.
#
# Trivy's built-in rules stay ON (cloud keys, GitHub/GitLab tokens, private
# keys, Slack/Stripe/... tokens). This file ADDS the one thing they do not
# cover in this project — a password inside a SQL Server connection string or
# an env file — and ALLOWS one documented, public placeholder.
# =============================================================================

rules:
  - id: sql-connection-password
    category: Database
    title: Password in a connection string or env file
    severity: HIGH
    # Keywords are a fast pre-filter: only files containing one of them are
    # checked with the regex below.
    keywords:
      - password
      - pwd
    # Matches  Password=Something  /  PWD=Something  /  MSSQL_SA_PASSWORD=Something
    # Does NOT match a value that starts with $ (a variable: ${MSSQL_SA_PASSWORD})
    # or < (a placeholder: <set-in-.env>), or a value shorter than 4 characters.
    regex: '(?i)(?:password|pwd)\s*=\s*(?P<secret>[^;"''\s<$]{4,})'
    secret-group-name: secret

# ---------------------------------------------------------------------------
# ALLOW RULES — leave this block COMMENTED until Step 2.4 of the Lab Guide.
# First see what the scanner finds. Then decide, finding by finding: remove the
# value, or allow it here with a reason, an owner and a review date.
# ---------------------------------------------------------------------------
allow-rules:
  # An allow rule is an EXCEPTION. Like every exception in this course it needs
  # a reason, an owner and a review date — in the description, because Trivy
  # has no expiry field for secret allow rules.
  - id: public-placeholder-password
    description: >-
      Your_strong_Passw0rd is the course's PUBLIC placeholder for throwaway local
      and test SQL Server containers (allowlisted since Session 2). It protects
      nothing and is never used outside a developer machine or CI.
      Owner: <your team>. Reviewed: 2026-11. Review again: 2027-05.
    regex: Your_strong_Passw0rd
    
