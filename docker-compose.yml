name: devopslab

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devopslab-sqlserver
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: "Developer"
    networks:
      - backend
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devopslab-api:local
    container_name: devopslab-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: >-
        Server=sqlserver,1433;Database=DevOpsLab;User Id=sa;
        Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};
        TrustServerCertificate=True;Encrypt=True;Connect Timeout=3
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  mssql-data: