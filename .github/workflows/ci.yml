# ============================================================================
# Reference solution - Session 8: Registry, Provenance, SemVer, Build Once
# This is the Session 7 ci.yml, EXTENDED. Still one workflow file.
#
# On a pull request (unchanged from Session 7) - three required checks:
#   build-and-test, sast, supply-chain   (+ the code-scanning check "CodeQL")
#
# On a push to main (after a merge) - two more jobs, never required checks:
#   release   release-please: keeps a release PR open; when that PR is merged,
#             creates the Git tag vX.Y.Z, the GitHub release and the CHANGELOG
#   publish   runs only if ALL gates are green. Loads the exact image that
#             supply-chain built and scanned (Build Once), pushes it to GHCR,
#             tags it sha-<commit> (and X.Y.Z on a release), and attaches two
#             attestations: SLSA build provenance and the CycloneDX SBOM.
#
# The image is built ONCE, in supply-chain. The bytes that were scanned are
# the bytes that are pushed - publish never runs `docker build`.
#
# Later sessions extend THIS file:
#   Session 9  - deploy the published digest to Staging, smoke tests
#   Session 10 - database migrations and the Production approval gate
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# NO paths-ignore: a skipped required workflow never reports its check.

# Least privilege by default. Only the `sast` job widens it, for itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit bash = `bash --noprofile --norc -eo pipefail {0}` (Session 5).
defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  COVERAGE_THRESHOLD: 75          # agreed in Session 4 - never lowered to fit
  DIFF_COVERAGE_THRESHOLD: 80

jobs:
  # --------------------------------------------------------------------------
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0            # diff coverage needs the history of main

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DevOpsLab.sln

      # Session 7. `dotnet list package --vulnerable` exits 0 even when it finds
      # something, and without --include-transitive it does not look where most
      # vulnerabilities live. The script fixes both, and fails closed.
      - name: Dependency gate (SCA, transitive included)
        run: bash scripts/dependency-gate.sh DevOpsLab.sln

      - name: Build
        run: dotnet build DevOpsLab.sln --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/DevOpsLab.UnitTests
          --configuration Release --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/unit
          --logger "trx;LogFileName=unit.trx"
          --logger GitHubActions

      - name: Integration tests (Testcontainers)
        run: >
          dotnet test tests/DevOpsLab.IntegrationTests
          --configuration Release --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/integration
          --logger "trx;LogFileName=integration.trx"
          --logger GitHubActions

      - name: Merge coverage reports
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage \
            -reporttypes:"Cobertura;MarkdownSummaryGithub"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        run: bash scripts/coverage-gate.sh --from coverage/Cobertura.xml --threshold "$COVERAGE_THRESHOLD"

      - name: Diff coverage gate
        if: github.event_name == 'pull_request'
        run: >
          bash scripts/diff-coverage.sh
          --from coverage/Cobertura.xml
          --base "origin/${{ github.base_ref }}"
          --threshold "$DIFF_COVERAGE_THRESHOLD"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            TestResults/**/*.trx
            coverage/
          if-no-files-found: ignore
          retention-days: 14

  # --------------------------------------------------------------------------
  sast:
    name: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Job-level permissions REPLACE the workflow-level ones for this job only.
    permissions:
      contents: read
      security-events: write        # upload results to the Security tab
      actions: read                 # read workflow metadata (private repositories)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # build-mode: none - CodeQL reads the C# source without compiling it.
      # Minutes instead of a full build; slightly less precise. Session 8 may
      # switch to `manual` if a real finding is missed.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # scripts/trivy.sh mounts this folder as Trivy's cache, so the
      # vulnerability database is downloaded once, not once per scan. It lives
      # OUTSIDE the checkout, or the repository secret scan would read it.
      # (The `runner` context is not available in a job-level `env:` block,
      # hence a step.)
      - name: Locate the Trivy cache
        run: echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"

      - name: Cache the Trivy database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-${{ runner.os }}-

      # 1. Secrets in the working tree. Built-in rules (cloud keys, tokens,
      #    private keys) plus the course rule for connection-string passwords.
      - name: Secret scan (repository)
        run: >
          bash scripts/trivy.sh fs
          --scanners secret
          --secret-config trivy-secret.yaml
          --skip-dirs .git
          --exit-code 1
          .

      # 2. Dockerfile misconfiguration - catches a Dockerfile that runs as root
      #    (check DS002) before an image even exists.
      - name: Dockerfile misconfiguration
        run: >
          bash scripts/trivy.sh config
          --severity HIGH,CRITICAL
          --exit-code 1
          .

      - name: Build image
        id: build
        run: docker build -t devopslab-api:ci .

      # 3. The image itself - the same proof as Session 6, now enforced by CI.
      - name: Image runs as non-root
        run: bash scripts/verify-nonroot.sh devopslab-api:ci

      # 4. Known vulnerabilities in the OS packages AND the NuGet packages
      #    inside the image, plus secrets baked into any layer.
      #    Exceptions only through .trivyignore.yaml - each with a statement and
      #    an expiry date.
      - name: Image scan (vulnerabilities and secrets)
        run: >
          bash scripts/trivy.sh image
          --scanners vuln,secret
          --secret-config trivy-secret.yaml
          --severity HIGH,CRITICAL
          --ignorefile .trivyignore.yaml
          --exit-code 1
          devopslab-api:ci

      # 5. SBOM - generated whenever the image was built, even if the scan
      #    above failed: a failing build is exactly when you want the list.
      - name: SBOM (CycloneDX)
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p sbom
          bash scripts/trivy.sh image \
            --format cyclonedx \
            --output sbom/devopslab-api.cdx.json \
            devopslab-api:ci

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ github.run_number }}-${{ github.run_attempt }}
          path: sbom/
          if-no-files-found: ignore
          retention-days: 90

      # NEW STEP: Hand the image over to the publish job (Part 1, Step 1)
      - name: Save the scanned image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-candidate
          docker save devopslab-api:ci | gzip > release-candidate/image.tar.gz
          cp sbom/devopslab-api.cdx.json release-candidate/

      # NEW STEP: Upload the handover artifact (Part 1, Step 1)
      - name: Upload the release candidate (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-candidate/
          retention-days: 1
          overwrite: true

  publish:
    name: publish
    needs: [build-and-test, sast, supply-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write               # push to ghcr.io with GITHUB_TOKEN
      id-token: write               # OIDC token for the signing certificate
      attestations: write           # store the attestations

    steps:
      - name: Download the release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-candidate

      # The image supply-chain scanned - not a new build of the same commit.
      - name: Load the scanned image
        run: gunzip -c release-candidate/image.tar.gz | docker load

      # GHCR requires lower case; owner names often are not.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        id: push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          docker tag devopslab-api:ci "$IMAGE:$sha_tag"
          docker push "$IMAGE:$sha_tag"

          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$sha_tag")"
          digest="${ref#*@}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          {
            echo "### Published"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Tags | $sha_tag |"
            echo "| **Digest** | \`$digest\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # SLSA build provenance: a signed statement that THIS workflow, from THIS
      # commit of THIS repository, produced THIS digest.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # The SBOM of the same digest, signed the same way.
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: release-candidate/devopslab-api.cdx.json
          push-to-registry: true
          create-storage-record: false