# ============================================================================
# Reference solution - Session 8: Registry, Provenance, SemVer, Build Once
# This is the Session 7 ci.yml, EXTENDED. Still one workflow file.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  COVERAGE_THRESHOLD: 75          
  DIFF_COVERAGE_THRESHOLD: 80

jobs:
  # --------------------------------------------------------------------------
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0            

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DevOpsLab.sln

      - name: Dependency gate (SCA, transitive included)
        run: bash scripts/dependency-gate.sh DevOpsLab.sln

      - name: Build
        run: dotnet build DevOpsLab.sln --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/DevOpsLab.UnitTests
          --configuration Release --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/unit
          --logger "trx;LogFileName=unit.trx"
          --logger GitHubActions

      - name: Integration tests (Testcontainers)
        run: >
          dotnet test tests/DevOpsLab.IntegrationTests
          --configuration Release --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/integration
          --logger "trx;LogFileName=integration.trx"
          --logger GitHubActions

      - name: Merge coverage reports
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage \
            -reporttypes:"Cobertura;MarkdownSummaryGithub"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        run: bash scripts/coverage-gate.sh --from coverage/Cobertura.xml --threshold "$COVERAGE_THRESHOLD"

      - name: Diff coverage gate
        if: github.event_name == 'pull_request'
        run: >
          bash scripts/diff-coverage.sh
          --from coverage/Cobertura.xml
          --base "origin/${{ github.base_ref }}"
          --threshold "$DIFF_COVERAGE_THRESHOLD"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            TestResults/**/*.trx
            coverage/
          if-no-files-found: ignore
          retention-days: 14

  # --------------------------------------------------------------------------
  sast:
    name: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write        
      actions: read                 

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  # --------------------------------------------------------------------------
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate the Trivy cache
        run: echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"

      - name: Cache the Trivy database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-${{ runner.os }}-

      - name: Secret scan (repository)
        run: >
          bash scripts/trivy.sh fs
          --scanners secret
          --secret-config trivy-secret.yaml
          --skip-dirs .git
          --exit-code 1
          .

      - name: Dockerfile misconfiguration
        run: >
          bash scripts/trivy.sh config
          --severity HIGH,CRITICAL
          --exit-code 1
          .

      - name: Build image
        id: build
        run: docker build -t devopslab-api:ci .

      - name: Image runs as non-root
        run: bash scripts/verify-nonroot.sh devopslab-api:ci

      - name: Image scan (vulnerabilities and secrets)
        run: >
          bash scripts/trivy.sh image
          --scanners vuln,secret
          --secret-config trivy-secret.yaml
          --severity HIGH,CRITICAL
          --ignorefile .trivyignore.yaml
          --exit-code 1
          devopslab-api:ci

      - name: SBOM (CycloneDX)
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p sbom
          bash scripts/trivy.sh image \
            --format cyclonedx \
            --output sbom/devopslab-api.cdx.json \
            devopslab-api:ci

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ github.run_number }}-${{ github.run_attempt }}
          path: sbom/
          if-no-files-found: ignore
          retention-days: 90

      - name: Save the scanned image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-candidate
          docker save devopslab-api:ci | gzip > release-candidate/image.tar.gz
          cp sbom/devopslab-api.cdx.json release-candidate/

      - name: Upload the release candidate (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-candidate/
          retention-days: 1
          overwrite: true

  # --------------------------------------------------------------------------
  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write               
      pull-requests: write          
      issues: write                 
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # --------------------------------------------------------------------------
  publish:
    name: publish
    needs: [build-and-test, sast, supply-chain, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write               
      id-token: write               
      attestations: write           

    steps:
      - name: Download the release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-candidate

      - name: Load the scanned image
        run: gunzip -c release-candidate/image.tar.gz | docker load

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        id: push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          RELEASE_CREATED: ${{ needs.release.outputs.release_created }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          docker tag devopslab-api:ci "$IMAGE:$sha_tag"
          docker push "$IMAGE:$sha_tag"

          # A release adds a SemVer tag to the SAME image: same digest.
          if [ "$RELEASE_CREATED" = "true" ]; then
            docker tag devopslab-api:ci "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
          fi

          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$sha_tag")"
          digest="${ref#*@}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          {
            echo "### Published"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Tags | $sha_tag |"
            echo "| **Digest** | \`$digest\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: release-candidate/devopslab-api.cdx.json
          push-to-registry: true
          create-storage-record: false